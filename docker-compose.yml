# Prowlarr 索引器管理：网页经云吞网关代登录，索引器出网由 network.egress 提供；
# 配了 torrent_client 能力（qBittorrent Web API）时，一次性服务把它登记成下载客户端。
services:
  prowlarr:
    # LinuxServer.io 的 Prowlarr 镜像，上游安装文档指定的镜像（lscr.io/linuxserver/prowlarr 的 Docker Hub 名），
    # amd64 和 arm64，按清单列表（index）的摘要固定；上游 GPL-3.0-only。
    image: linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    # 镜像以 root 启动再降到 PUID:PGID（LSIO 约定），数据目录由核心按默认交给 PUID:PGID。
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # 认证交给反向代理：应用不再有自己的登录页，网页只经云吞网关进来。
      # Prowlarr 不认代登录头（External 模式下应用侧零鉴权），保护来自网关会话和插件网络隔离；
      # 下面的核心地址只供核心检查识别“只信任核心”，应用本身不读它。
      WONTON_CORE_ADDRESS: ${WONTON_CORE_ADDRESS}
      PROWLARR__AUTH__METHOD: External
    volumes:
      - ${WONTON_APP_DATA}/config:/config
    healthcheck:
      # /ping 免鉴权，且会真查一次数据库，能发现应用起没起来。
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 30s

  # 一次性服务：把 torrent_client 能力（qBittorrent Web API）登记成 Prowlarr 的下载客户端。
  # 能力核心还没合入：WONTON_TORRENT_CLIENT_URL 没注入时如实说明并跳过，装得上、其他功能照常；
  # 等能力声明字段定稿后这里改成必填。
  provision:
    image: linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    entrypoint: ["/bin/sh", "/provision.sh"]
    environment:
      WONTON_TORRENT_CLIENT_URL: ${WONTON_TORRENT_CLIENT_URL:-}
    volumes:
      - ${WONTON_APP_DATA}/config:/config:ro
    configs:
      - source: provision
        target: /provision.sh
    depends_on:
      prowlarr:
        condition: service_healthy
    restart: "no"

configs:
  provision:
    file: provision.sh

x-wonton:
  spec: "0.6"
  id: com.prowlarr.prowlarr
  version: 0.1.0
  kind: app
  title: { en: Prowlarr }
  description:
    zh: 统一管理影视索引器，一处搜索，同步给下载应用
    en: Manage all your torrent indexers in one place and sync them to your download apps
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/indexers.png, screenshots/add-indexer.png, screenshots/search.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://prowlarr.com
  # 应用（Prowlarr）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [下载, 影视, 搜索]
    en: [Downloads, Video, Search]
  about:
    zh: |
      Prowlarr 把你的索引站集中到一处：从内置的几百个定义里添加索引器，测连通性，自动同步给 Radarr、Sonarr、qBittorrent 这类应用，也能直接搜索、把种子抓进下载队列。

      打开就用，不用再登录一次；索引器和设置都保存在家里，重装不丢。搜索索引站需要能访问外网；配了 qBittorrent 插件后，抓取会直接进它的下载队列。
    en: |
      Prowlarr keeps your index sites in one place: add indexers from a few hundred built-in definitions, test them, sync them to Radarr, Sonarr or qBittorrent, and search and grab torrents straight into your download queue.

      Open it and start working, no second login; indexers and settings live at home and survive reinstalls. Searching index sites needs internet access. With the qBittorrent plugin installed, grabs go straight into its download queue.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: prowlarr
    port: 9696
    # 网关代登录：External 模式下 Prowlarr 不再显示登录页，由网关挡住未登录的访问。
    sso: proxy
    proxy:
      headers:
        Remote-User: "{user}"
  permissions:
    # 抓索引站、拉取索引器定义更新都要出网。
    - network.egress
  requirements:
    arch: [amd64, arm64]
